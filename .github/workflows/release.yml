name: release

# Publish the package to npm with provenance when a version tag is pushed.
# The first publish is done manually (see RELEASING.md); after that, configure
# a Trusted Publisher on npmjs.com for this repository + workflow and this job
# needs no stored token. The workflow requires a public repository.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
