name: Release

# Publishes @cleocode/goal to npm when a v* tag is pushed, through npm Trusted
# Publishing (OIDC): no npm token is stored anywhere. The npmjs.com trusted
# publisher must name this repository and this file (release.yml). npm only
# allows that configuration once the package exists, so the very first version
# is published once by hand; every later tag publishes from here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: bun run typecheck
      - run: bun test test/unit --timeout 120000
      # prepublishOnly re-checks that the committed dist/ is current.
      - run: npm publish --provenance --access public
