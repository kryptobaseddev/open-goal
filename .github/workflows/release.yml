name: Release

# Publishes @cleocode/goal to npm when a v* tag is pushed, through npm Trusted
# Publishing (OIDC): no npm token is stored anywhere. The npmjs.com trusted
# publisher must name this repository and this file (release.yml). npm only
# allows that configuration once the package exists, so the very first version
# is published once by hand; every later tag publishes from here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Trusted publishing needs npm >= 11.5.1; pinned exactly.
      - run: npm install -g npm@11.21.1
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: bun run typecheck
      - run: bun test test/unit --timeout 120000
      # A manual first publish is required before npm can attach a trusted
      # publisher. Pushing that same version's tag afterwards must no-op, not
      # fail the release run.
      - name: Skip an already-published version
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@cleocode/goal@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@cleocode/goal@$version is already on npm; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # prepublishOnly re-checks that the committed dist/ is current.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
